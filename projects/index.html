layout: default
title: Projects
permalink: /projects/
---

<h1>Projects</h1>
<ul>
  {% for project in site.data.projects %}
    <li>
      <strong>{{ project.name }}</strong> — {{ project.description }}
      {% if project.url %}(<a href="{{ project.url }}" target="_blank" rel="noopener">link</a>){% endif %}
    </li>
  {% endfor %}
</ul>
