---
layout: default
---
<article class="post">
  {% if page.image %}
  <img class="post-cover" src="{{ page.image | relative_url }}" alt="{{ page.title }}">
  {% endif %}
  <header>
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%d %B %Y" }}</p>
  </header>
  <section class="post-body">
    {{ content }}
  </section>
</article>
