<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="icon" href="{{ '/assets/favicon.png' | relative_url }}" type="image/png">
    <link rel="stylesheet" href="{{ '/assets/styles.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {delimiters: [{left: '\\(', right: '\\)', display: false}, {left: '\\[', right: '\\]', display: true}]});"></script>

    {% if page.layout == "post" %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BlogPosting",
      "headline": "{{ page.title | escape }}",
      "author": {
        "@type": "Person",
        "name": "Maksim Loginov"
      },
      "datePublished": "{{ page.date | date_to_xmlschema }}",
      "dateModified": "{{ page.date | date_to_xmlschema }}",
      "url": "{{ page.url | absolute_url }}",
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "{{ page.url | absolute_url }}"
      },
      "publisher": {
        "@type": "Organization",
        "name": "LogMaks Research Blog",
        "logo": {
          "@type": "ImageObject",
          "url": "{{ '/assets/favicon.png' | absolute_url }}"
        }
      },
      "description": "{{ page.excerpt | strip_html | strip_newlines | truncate: 160 | escape }}"
    }
    </script>
    {% endif %}
  </head>
  <body>
    {% include header.html %}
    <main class="site-main container">
      {{ content }}
    </main>
    {% include footer.html %}
  </body>
</html>
