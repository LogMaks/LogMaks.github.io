<!-- Mobile menu toggle -->
<button class="mobile-menu-toggle" onclick="toggleSidebar()">
  <span class="material-icons">menu</span>
</button>

<!-- Mobile overlay -->
<div class="mobile-overlay" onclick="closeSidebar()"></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <img src="{{ '/assets/avatar.jpg' | relative_url }}" alt="{{ site.title }}" class="sidebar-avatar">
    <h1 class="sidebar-title">{{ site.title | default: 'LogMaks' }}</h1>
    <p class="sidebar-subtitle">Исследователь и инженер, специализирующийся на машинном обучении и промышленной автоматизации.</p>
  </div>
  
  <nav class="sidebar-nav">
    <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>
      <span class="material-icons">home</span>
      Главная
    </a>
    <a href="{{ '/posts/' | relative_url }}" {% if page.url == '/posts/' %}aria-current="page"{% endif %}>
      <span class="material-icons">article</span>
      Блог
    </a>
    <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>
      <span class="material-icons">person</span>
      Обо мне
    </a>
    <a href="{{ '/assets/cv_en.pdf' | relative_url }}" target="_blank" rel="noopener">
      <span class="material-icons">description</span>
      Резюме
    </a>
  </nav>
  
  <div class="sidebar-footer">
    <div class="sidebar-social">
      <a href="https://github.com/{{ site.github_username | default: 'logmaks' }}" target="_blank" rel="noopener" title="GitHub">
        <span class="material-icons">code</span>
      </a>
      <a href="mailto:your-email@example.com" title="Email">
        <span class="material-icons">email</span>
      </a>
      <a href="#" title="LinkedIn">
        <span class="material-icons">linkedin</span>
      </a>
    </div>
  </div>
</aside>

<script>
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.querySelector('.mobile-overlay');
  
  sidebar.classList.toggle('open');
  overlay.classList.toggle('open');
}

function closeSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.querySelector('.mobile-overlay');
  
  sidebar.classList.remove('open');
  overlay.classList.remove('open');
}

// Close sidebar when clicking outside on mobile
document.addEventListener('click', function(event) {
  const sidebar = document.getElementById('sidebar');
  const toggle = document.querySelector('.mobile-menu-toggle');
  
  if (window.innerWidth <= 768 && 
      !sidebar.contains(event.target) && 
      !toggle.contains(event.target) && 
      sidebar.classList.contains('open')) {
    closeSidebar();
  }
});
</script>
