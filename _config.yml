title: "Maksim Loginov"
description: "AI / ML researcher and developer — reinforcement learning, multi-agent systems, industrial decision support"
url: "https://logmaks.github.io"
baseurl: ""

# GitHub Pages compatible plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  math_engine: mathjax

highlighter: rouge
permalink: /posts/:title/
timezone: UTC
lang: en

author:
  name: "Maksim Loginov"
  email: "lomaxart@gmail.com"
  url: "/about/"

collections:
  posts:
    output: true
  projects:
    output: true
    permalink: /projects/:title/
  lab_notes:
    output: true
    permalink: /lab-notes/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: "Maksim Loginov"
      image: ""
  - scope:
      path: ""
      type: "projects"
    values:
      layout: post
      author: "Maksim Loginov"
      image: ""
  - scope:
      path: ""
      type: "lab_notes"
    values:
      layout: post
      author: "Maksim Loginov"
      image: ""

sass:
  style: compressed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

google_site_verification: ""
