title: "LogMaks — RL & MAS Research"
description: "Focus on Marginal Hierarchical RL and asymmetric multi-agent systems"
url: "https://logmaks.github.io"
baseurl: ""

# GitHub Pages compatible plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  math_engine: mathjax

highlighter: rouge
permalink: /posts/:title/
timezone: UTC
lang: en

author:
  name: "LogMaks"
  email: ""
  url: "/about/"

collections:
  posts:
    output: true
  projects:
    output: true
    permalink: /projects/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: "LogMaks"
      image: ""
  - scope:
      path: ""
      type: "projects"
    values:
      layout: post
      author: "LogMaks"
      image: ""

sass:
  style: compressed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

google_site_verification: "WGILJzdSpJrU6FLRCrsJNX2xDjjc3vUUHccT3-HFpuk"