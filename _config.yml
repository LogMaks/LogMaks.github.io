title: "LogMaks Journal"
description: "Научный блог, заметки и проекты"
url: "https://logmaks.github.io"
baseurl: ""

# GitHub Pages совместимые плагины
plugins:
  - jekyll-feed
  - jekyll-seo-tag

markdown: kramdown
highlighter: rouge
permalink: /posts/:title/
timezone: Europe/Moscow

author:
  name: "LogMaks"
  email: ""
  url: "/about/"

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: "LogMaks"
      image: ""

sass:
  style: compressed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

