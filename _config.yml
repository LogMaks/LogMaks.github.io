title: "Maksim Loginov"
tagline: "ML Engineer / RL Researcher"
description: "Simulation-based prototypes for industrial maintenance, HITL decision loops, and uncertainty-aware diagnostics."
url: "https://logmaks.github.io"
baseurl: ""
lang: en
locale: en_US

# GitHub Pages compatible plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  math_engine: mathjax

highlighter: rouge
permalink: /posts/:title/
timezone: UTC

author:
  name: "Maksim Loginov"
  email: "lomaxart@gmail.com"
  url: "https://logmaks.github.io/about/"

# Used by jekyll-seo-tag for OG / Twitter cards
logo: /assets/avatar.jpg

social:
  name: Maksim Loginov
  links:
    - https://github.com/LogMaks
    - https://www.linkedin.com/in/lomaxart/
    - https://scholar.google.com/citations?user=YDrAHzgAAAAJ
    - https://orcid.org/0009-0005-7256-5718
    - https://t.me/lomaxart

collections:
  posts:
    output: true
  projects:
    output: true
    permalink: /projects/:title/
  lab_notes:
    output: true
    permalink: /lab-notes/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: "Maksim Loginov"
      image: "/assets/avatar.jpg"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: post
      author: "Maksim Loginov"
      image: "/assets/avatar.jpg"
  - scope:
      path: ""
      type: "lab_notes"
    values:
      layout: post
      author: "Maksim Loginov"
      image: "/assets/avatar.jpg"
  - scope:
      path: "google5060b7592b7460a9.html"
    values:
      sitemap: false
  - scope:
      path: "assets/cv_en.pdf"
    values:
      sitemap: false
  - scope:
      path: "desktop.ini"
    values:
      sitemap: false

sass:
  style: compressed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - desktop.ini
  - .DS_Store
  - vendor
  - node_modules
