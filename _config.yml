title: "LogMaks — RL & MAS Research"
description: "Фокус на Marginal Hierarchical RL и асимметричные мультиагентные системы"
url: "https://logmaks.github.io"
baseurl: ""

# GitHub Pages совместимые плагины
plugins:
  - jekyll-feed
  - jekyll-seo-tag

markdown: kramdown
kramdown:
  math_engine: mathjax
highlighter: rouge
permalink: /posts/:title/
timezone: UTC
lang: en

author:
  name: "LogMaks"
  email: ""
  url: "/about/"

collections:
  posts:
    output: true
  projects:
    output: true
    permalink: /projects/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: "LogMaks"
      image: ""
  - scope:
      path: ""
      type: "projects"
    values:
      layout: post
      author: "LogMaks"
      image: ""

sass:
  style: compressed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

